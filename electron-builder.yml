# Empacotamento do app desktop (Windows): npm run dist:win
# Gera em release/:
#   Frenching-Setup-<versão>.exe        instalador (atualiza sozinho pelos Releases)
#   Frenching-Setup-<versão>.exe.blockmap  usado na atualização (baixa só o que mudou)
#   latest.yml                           a versão mais recente, lida pelo app instalado
#   Frenching-<versão>-portable.exe      versão portátil (sem atualização automática)
# Os quatro vão anexados à release do GitHub (veja o README).
appId: com.kiingsway.frenching
productName: Frenching
copyright: Copyright © 2026 King Sway

directories:
  output: release
  buildResources: build

# No pacote vão o app compilado e só as dependências do processo principal
# (electron-updater, em "dependencies"). React, MUI, Firebase etc. ficam em
# "devDependencies": o electron-vite já os embute em out/
files:
  - out/**/*
  - package.json

win:
  icon: build/icon.png
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Frenching
  artifactName: Frenching-Setup-${version}.${ext}

portable:
  artifactName: Frenching-${version}-portable.${ext}

# Onde o app instalado procura versões novas (vai para resources/app-update.yml).
# O build não envia nada sozinho (npm run dist:win usa --publish never): os arquivos
# são anexados à release do GitHub
publish:
  provider: github
  owner: kiingsway
  repo: frenching-app
  releaseType: release
