# Publica o app do Windows nos Releases a cada push na main (veja o README → Releases).
# A versão vem do package.json. Se já existe Release dessa versão, não faz nada.
# Os apps instalados encontram a versão nova sozinhos (src/main/updater.ts).
name: Release do Windows

on:
  push:
    branches: [main]

# Pushes seguidos entram na fila: um build em andamento não é cancelado no meio do envio
concurrency:
  group: release-windows
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Lê a versão e procura a Release
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "A Release v$VERSION já existe: nada a publicar"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 24
          cache: npm

      - name: Gera o instalador e a versão portátil
        if: steps.version.outputs.exists == 'false'
        env:
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ secrets.MAIN_VITE_GOOGLE_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.MAIN_VITE_GOOGLE_CLIENT_SECRET }}
        run: |
          # Sem o cliente OAuth, o app sairia sem o login com Google: melhor falhar aqui
          if [ -z "$MAIN_VITE_GOOGLE_CLIENT_ID" ] || [ -z "$MAIN_VITE_GOOGLE_CLIENT_SECRET" ]; then
            echo "::error::Faltam os Secrets MAIN_VITE_GOOGLE_CLIENT_ID e MAIN_VITE_GOOGLE_CLIENT_SECRET no GitHub"
            exit 1
          fi
          npm ci
          npm run dist:win

      - name: Publica a Release
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Frenching $VERSION" \
            --generate-notes \
            --latest \
            "release/Frenching-Setup-$VERSION.exe" \
            "release/Frenching-Setup-$VERSION.exe.blockmap" \
            "release/latest.yml" \
            "release/Frenching-$VERSION-portable.exe"
